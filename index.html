/* ---------- 播放引擎 ---------- */
let lastTs = 0;
function tick(ts){
  const dt = Math.min(0.1, (ts - lastTs) / 1000);
  lastTs = ts;
  if (state.playing){
    state.time += dt;
    if (state.time >= state.duration){
      if (exporting){ finishExport(); }
      else { state.time = state.duration; setPlaying(false); }
    }
    syncMedia();
    $('#playhead').style.left = (state.time * state.pxPerSec) + 'px';
    $('#timeLabel').innerHTML = '<b>' + fmtTime(state.time) + '</b> / ' + fmtTime(state.duration);
    if (exporting) updateExportProgress();
  }
  drawFrame();
  requestAnimationFrame(tick);
}
function setPlaying(p){
  state.playing = p;
  $('#btnPlay').textContent = p ? '⏸' : '▶';
  if (!p) pauseAllMedia();
}
function togglePlay(){
  if (!allClips().length){ toast('时间轴还是空的，先添加素材吧'); return; }
  if (!state.playing && state.time >= state.duration - 0.01) state.time = 0;
  setPlaying(!state.playing);
  if (state.playing) syncMedia();
}
function pauseAllMedia(){
  for (const c of allClips()){
    const el = mediaEl(c);
    if (el && el.pause){ try { el.pause(); } catch(e){} }
  }
}
function seek(t){
  state.time = clamp(t, 0, state.duration);
  syncMedia();
  $('#playhead').style.left = (state.time * state.pxPerSec) + 'px';
  $('#timeLabel').innerHTML = '<b>' + fmtTime(state.time) + '</b> / ' + fmtTime(state.duration);
}
/* 同步各片段媒体元素到当前时间 */
function syncMedia(){
  for (const t of ['video','audio']){
    for (const c of state.tracks[t]){
      if (c.type === 'image') continue;   // 图片片段无媒体时钟
      const key = t === 'video' ? rowKey(c.trackN || 0) : t;
      if (trackHidden(key)){
        const hel = mediaEl(c);
        if (hel && !hel.paused){ try { hel.pause(); } catch(e){} }
        continue;
      }
      const el = mediaEl(c);
      if (!el) continue;
      const active = state.time >= c.start - 0.02 && state.time < clipEnd(c);
      if (active){
        const speed = c.speed || 1;
        const target = (c.in || 0) + (state.time - c.start) * speed;
        if (state.playing){
          if (Math.abs(el.currentTime - target) > 0.25){
            try { el.currentTime = target; } catch(e){}
          }
          try { el.playbackRate = speed; } catch(e){}
          el.volume = clamp(c.volume, 0, 1);
          el.muted = !!c.muted;
          if (el.paused){ el.play().catch(() => {}); }
        } else {
          if (!el.paused) el.pause();
          if (Math.abs(el.currentTime - target) > 0.08){
            try { el.currentTime = target; } catch(e){}
          }
        }
      } else {
        if (!el.paused) el.pause();
      }
    }
  }
}

/* ---------- 画面合成 ---------- */
function filterStr(f){
  const parts = [];
  const p = PRESETS[f.preset];
  if (p && p.filter) parts.push(p.filter);
  if (f.bright !== 1) parts.push('brightness(' + f.bright + ')');
  if (f.contrast !== 1) parts.push('contrast(' + f.contrast + ')');
  if (f.sat !== 1) parts.push('saturate(' + f.sat + ')');
  return parts.join(' ') || 'none';
}
/* 带变换的片段层绘制：tr={x,y(%) scale,opacity,rot}，支持转场裁剪/位移/缩放 */
function clipSourceDims(c, el){
  return c.type === 'video' ? [el.videoWidth, el.videoHeight] : [el.naturalWidth, el.naturalHeight];
}
function drawClipLayer(c, el, tr, alphaMul, opts){
  opts = opts || {};
  const dims = clipSourceDims(c, el);
  if (!dims[0] || !dims[1]) return;
  ctx.save();
  ctx.globalAlpha = clamp(tr.opacity * alphaMul, 0, 1);
  if (opts.clipFn){ ctx.beginPath(); opts.clipFn(); ctx.clip(); }
  ctx.translate(tr.x / 100 * CW + (opts.dx || 0), tr.y / 100 * CH + (opts.dy || 0));
  if (tr.rot) ctx.rotate(tr.rot * Math.PI / 180);
  const sc = tr.scale * (opts.scaleMul || 1);
  ctx.filter = filterStr(c.filter);
  drawSourceIntoBox(el, dims[0], dims[1], CW * sc, CH * sc);
  ctx.restore();
  ctx.filter = 'none';
  ctx.globalAlpha = 1;
}
/* 转场背景：前一片段末帧（预览懒 seek 允许短暂陈旧；导出前已精确 seek） */
function drawTransitionBackdrop(prev){
  const el = mediaEl(prev);
  if (!el) return false;
  const speed = prev.speed || 1;
  if (prev.type === 'video'){
    const targetEnd = (prev.in || 0) + Math.max(0, prev.dur - 0.02) * speed;
    if (!el.seeking && Math.abs(el.currentTime - targetEnd) > 0.2){
      try { el.currentTime = targetEnd; } catch(e){}
    }
    if (el.readyState < 2) return false;
    ctx.filter = filterStr(prev.filter);
    drawCover(el, el.videoWidth, el.videoHeight);
    ctx.filter = 'none';
    return true;
  }
  if (prev.type === 'image' && el.complete && el.naturalWidth){
    ctx.filter = filterStr(prev.filter);
    drawCover(el, el.naturalWidth, el.naturalHeight);
    ctx.filter = 'none';
    return true;
  }
  return false;
}
function drawTransition(c, el, tr, prev, p, fa){
  const type = c.transIn.type;
  if (prev) drawTransitionBackdrop(prev);
  if (type === 'fade' || type === 'dissolve'){
    drawClipLayer(c, el, tr, fa * p);
  } else if (type === 'zoom'){
    drawClipLayer(c, el, tr, fa * p, { scaleMul: 0.5 + 0.5 * p });
  } else if (type === 'wipeL' || type === 'wipeR' || type === 'circle'){
    drawClipLayer(c, el, tr, fa, {
      clipFn: () => {
        if (type === 'wipeL') ctx.rect(0, 0, p * CW, CH);
        else if (type === 'wipeR') ctx.rect(CW - p * CW, 0, p * CW, CH);
        else ctx.arc(CW / 2, CH / 2, p * Math.hypot(CW, CH) / 2, 0, Math.PI * 2);
      }
    });
  } else if (type === 'slideUp' || type === 'slideDown'){
    drawClipLayer(c, el, tr, fa, { dy: (1 - p) * CH * (type === 'slideUp' ? -1 : 1) });
  }
}
function drawFrame(){
  ctx.filter = 'none';
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, CW, CH);
  let hasPicture = false;

  // 视频多轨：V1 底层 → 高层叠加（画中画）
  const rows = Math.min(Math.max(maxUsedRow() + 1, state.vtrackCount), 4);
  for (let n = 0; n < rows; n++){
    if (rowHidden(n)) continue;
    for (const c of videoRowClips(n)){
      if (state.time < c.start || state.time >= clipEnd(c)) continue;
      const el = mediaEl(c);
      hasPicture = true;
      if (!el){ if (n === 0) drawMissing(c); continue; }
      const localT = state.time - c.start;
      const tr = clipTransform(c, localT);
      const fa = fadeAlpha(c);
      const trans = (c.transIn && c.transIn.type && c.transIn.type !== 'none') ? c.transIn : null;
      if (trans && n === 0 && localT < trans.dur){
        drawTransition(c, el, tr, prevClipOf(c, n), localT / Math.max(0.05, trans.dur), fa);
      } else {
        drawClipLayer(c, el, tr, fa);
      }
    }
  }
  // 文字
  for (const c of state.tracks.text){
    if (trackHidden('text')) break;
    if (state.time < c.start || state.time >= clipEnd(c)) continue;
    if (!c.text) continue;
    hasPicture = true;
    drawText(c, fadeAlpha(c));
  }
  $('#previewEmpty').style.display = (hasPicture || allClips().length) ? 'none' : 'flex';
}
function drawCover(el, w, h){
  if (!w || !h) return;
  const s = Math.max(CW / w, CH / h);
  const dw = w * s, dh = h * s;
  ctx.drawImage(el, (CW - dw) / 2, (CH - dh) / 2, dw, dh);
}
/* 以当前原点为中心，把源画面 cover 进 boxW×boxH 区域 */
function drawSourceIntoBox(el, srcW, srcH, boxW, boxH){
  if (!srcW || !srcH) return;
  const s = Math.max(boxW / srcW, boxH / srcH);
  const dw = srcW * s, dh = srcH * s;
  ctx.drawImage(el, -dw / 2, -dh / 2, dw, dh);
}
function drawMissing(c){
  ctx.fillStyle = '#2B2926';
  ctx.fillRect(0, 0, CW, CH);
  ctx.fillStyle = '#8A837B';
  ctx.font = '28px "Microsoft YaHei"';
  ctx.textAlign = 'center';
  ctx.fillText('⚠ 素材缺失：' + (assetOf(c) ? assetOf(c).name : c.id), CW / 2, CH / 2);
  ctx.textAlign = 'start';
}
function fadeAlpha(c){
  let a = 1;
  const local = state.time - c.start;
  if (c.fadeIn > 0) a = Math.min(a, local / c.fadeIn);
  if (c.fadeOut > 0) a = Math.min(a, (c.dur - local) / c.fadeOut);
  return clamp(a, 0, 1);
}
function drawText(c, alpha){
  const size = c.size;
  ctx.font = (c.bold ? 'bold ' : '') + size + 'px "Microsoft YaHei","PingFang SC",sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.globalAlpha = alpha;
  const x = c.x / 100 * CW, y = c.y / 100 * CH;
  const lines = c.text.split('\n');
  const lh = size * 1.3;
  if (c.bg){
    let maxW = 0;
    for (const ln of lines) maxW = Math.max(maxW, ctx.measureText(ln).width);
    const padX = size * .35, padY = size * .25;
    const boxW = maxW + padX * 2, boxH = lines.length * lh + padY * 2 - (lh - size);
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    roundRect(x - boxW / 2, y - boxH / 2, boxW, boxH, 10);
    ctx.fill();
  }
  ctx.fillStyle = c.color;
  ctx.shadowColor = 'rgba(0,0,0,.55)';
  ctx.shadowBlur = c.bg ? 0 : 6;
  ctx.shadowOffsetY = 2;
  const startY = y - (lines.length - 1) * lh / 2;
  lines.forEach((ln, i) => ctx.fillText(ln, x, startY + i * lh));
  ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  ctx.globalAlpha = 1;
  ctx.textAlign = 'start'; ctx.textBaseline = 'alphabetic';
}
function roundRect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* 预览画布上拖动文字/画中画位置 */
let textDrag = null;
let pipDrag = null;
cv.addEventListener('mousedown', e => {
  if (exporting) return;
  const rect = cv.getBoundingClientRect();
  const mx = (e.clientX - rect.left) / rect.width * CW;
  const my = (e.clientY - rect.top) / rect.height * CH;
  // 命中检测当前激活的文字片段（从上层往下）
  const actives = state.tracks.text.filter(c => state.time >= c.start && state.time < clipEnd(c) && c.text);
  for (let i = actives.length - 1; i >= 0; i--){
    const c = actives[i];
    ctx.font = (c.bold ? 'bold ' : '') + c.size + 'px "Microsoft YaHei"';
    const lines = c.text.split('\n');
    let maxW = 0;
    for (const ln of lines) maxW = Math.max(maxW, ctx.measureText(ln).width);
    const h = lines.length * c.size * 1.3;
    const cx = c.x / 100 * CW, cy = c.y / 100 * CH;
    if (Math.abs(mx - cx) <= maxW / 2 + 10 && Math.abs(my - cy) <= h / 2 + 10){
      textDrag = { clip: c, dx: c.x / 100 * CW - mx, dy: c.y / 100 * CH - my, moved: false };
      cv.style.cursor = 'grabbing';
      e.preventDefault();
      return;
    }
  }
  // 画中画/变换拖拽：从最上层视频行往下找命中片段
  for (let n = Math.min(maxUsedRow(), 3); n >= 0; n--){
    if (rowHidden(n)) continue;
    const vAct = videoRowClips(n).filter(c => (c.type === 'video' || c.type === 'image') &&
      state.time >= c.start && state.time < clipEnd(c));
    for (let i = vAct.length - 1; i >= 0; i--){
      const c = vAct[i];
      const tr = clipTransform(c, state.time - c.start);
      const bw = CW * tr.scale, bh = CH * tr.scale;
      const cx = tr.x / 100 * CW, cy = tr.y / 100 * CH;
      if (Math.abs(mx - cx) <= bw / 2 && Math.abs(my - cy) <= bh / 2){
        const editable = n > 0 || (c.kf && c.kf.length);
        if (!editable) return;   // 底层全屏片段不允许画布拖拽
        pipDrag = { clip: c, sx: mx, sy: my, ox: getTransformTarget(c).x, oy: getTransformTarget(c).y };
        selectClip('video', c.id);
        cv.style.cursor = 'grabbing';
        e.preventDefault();
        return;
      }
    }
  }
});
window.addEventListener('mousemove', e => {
  if (pipDrag){
    const rect = cv.getBoundingClientRect();
    const mx = (e.clientX - rect.left) / rect.width * CW;
    const my = (e.clientY - rect.top) / rect.height * CH;
    const tgt = getTransformTarget(pipDrag.clip);
    tgt.x = clamp(pipDrag.ox + (mx - pipDrag.sx) / CW * 100, 0, 100);
    tgt.y = clamp(pipDrag.oy + (my - pipDrag.sy) / CH * 100, 0, 100);
    drawFrame();
    if (state.selection && state.selection.id === pipDrag.clip.id) buildProps();
    return;
  }
  if (!textDrag) return;
  const rect = cv.getBoundingClientRect();
  const mx = (e.clientX - rect.left) / rect.width * CW;
  const my = (e.clientY - rect.top) / rect.height * CH;
  textDrag.clip.x = clamp((mx + textDrag.dx) / CW * 100, 0, 100);
  textDrag.clip.y = clamp((my + textDrag.dy) / CH * 100, 0, 100);
  textDrag.moved = true;
  drawFrame();
  if (state.selection && state.selection.id === textDrag.clip.id){
    const px = $('#pX'), py = $('#pY');
    if (px) px.value = Math.round(textDrag.clip.x);
    if (py) py.value = Math.round(textDrag.clip.y);
  }
});
window.addEventListener('mouseup', () => {
  if (pipDrag){
    pushHistory();
    pipDrag = null;
    cv.style.cursor = 'default';
    return;
  }
  if (textDrag){
    if (textDrag.moved) pushHistory();
    textDrag = null;
    cv.style.cursor = 'default';
  }
});

/* ---------- 缩放 ---------- */
function zoom(factor){
  const vals = [10, 20, 40, 60, 100, 160, 240, 360];
  let i = vals.findIndex(v => v >= state.pxPerSec);
  if (i < 0) i = vals.length - 1;
  i = clamp(i + factor, 0, vals.length - 1);
  state.pxPerSec = vals[i];
  layoutTimeline();
}
$('#zoomIn').addEventListener('click', () => zoom(1));
$('#zoomOut').addEventListener('click', () => zoom(-1));
tlScroll.addEventListener('wheel', e => {
  if (e.ctrlKey){
    e.preventDefault();
    zoom(e.deltaY < 0 ? 1 : -1);
  }
}, { passive: false });

/* ---------- 导出 ---------- */
let recorder = null, recChunks = [], actx = null, recDest = null;
const recSrcMap = new Map();

function ensureAudioGraph(){
  try {
    if (!actx){
      actx = new (window.AudioContext || window.webkitAudioContext)();
      recDest = actx.createMediaStreamDestination();
    }
    for (const c of allClips()){
      if (c.type !== 'video' && c.type !== 'audio') continue;
      const el = mediaEl(c);
      if (!el || recSrcMap.has(el)) continue;
      try {
        const src = actx.createMediaElementSource(el);
        src.connect(actx.destination);
        src.connect(recDest);
        recSrcMap.set(el, src);
      } catch(e){}
    }
    if (actx.state === 'suspended') actx.resume();
  } catch(e){}
}
function pickMime(){
  const cands = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
  for (const m of cands){
    if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m;
  }
  return '';
}
function startExport(){
  if (exporting) return;
  if (!allClips().length){ toast('时间轴还是空的，先添加素材吧'); return; }
  const mime = pickMime();
  if (!mime){ toast('当前浏览器不支持录制导出，请使用 Chrome / Edge'); return; }
  setPlaying(false);
  seek(0);
  ensureAudioGraph();
  const stream = cv.captureStream(30);
  if (recDest && recDest.stream){
    for (const t of recDest.stream.getAudioTracks()) stream.addTrack(t);
  }
  recChunks = [];
  try {
    recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8000000 });
  } catch(e){ toast('录制器初始化失败：' + e.message); return; }
  recorder.ondataavailable = e => { if (e.data && e.data.size) recChunks.push(e.data); };
  recorder.onstop = () => {
    if (!exporting) return;   // 用户取消
    exporting = false;
    const blob = new Blob(recChunks, { type: 'video/webm' });
    const name = ($('#projName').value.trim() || 'online-video') + '.webm';
    download(name, blob);
    closeModal();
    toast('导出完成：' + name + '（' + (blob.size / 1048576).toFixed(1) + ' MB）', 4000);
  };
  exporting = true;
  openExportModal();
  recorder.start(250);
  setPlaying(true);
}
function finishExport(){
  if (recorder && recorder.state !== 'inactive') recorder.stop();
  setPlaying(false);
}
function cancelExport(){
  exporting = false;
  try { if (recorder && recorder.state !== 'inactive') recorder.stop(); } catch(e){}
  setPlaying(false);
  closeModal();
  toast('已取消导出');
}
function updateExportProgress(){
  const el = $('#exportProgress');
  if (el){
    const pct = Math.min(100, state.time / state.duration * 100);
    el.style.width = pct + '%';
    $('#exportLabel').textContent = '正在实时录制 ' + fmtTime(state.time) + ' / ' + fmtTime(state.duration) + '（' + Math.round(pct) + '%）';
  }
}
function openExportModal(){
  $('#modalRoot').innerHTML =
    '<div class="modal-mask"><div class="modal"><h3>🎬 正在导出视频</h3>' +
    '<div class="m-body">采用浏览器实时录制（WebM 格式）。请保持此页面在前台，<b>不要切换标签页</b>，否则画面会丢帧。</div>' +
    '<div class="progress-outer"><div class="progress-inner" id="exportProgress"></div></div>' +
    '<div class="progress-label" id="exportLabel">准备中…</div>' +
    '<div class="m-btns" style="margin-top:14px;"><button id="btnCancelExport">取消导出</button></div>' +
    '</div></div>';
  $('#btnCancelExport').addEventListener('click', cancelExport);
}
function closeModal(){ $('#modalRoot').innerHTML = ''; }

/* =========================================================
 * 帧精确导出（WebCodecs + 自研 MP4 muxer，v1.2.0）
 * 视频：逐帧虚拟时间 seek → drawFrame → VideoFrame → H.264 编码
 * 音频：decodeAudioData → OfflineAudioContext 混音 → AAC 编码
 * 封装：渐进式 MP4（ftyp + mdat + moov，moov 在尾部，本地文件无碍）
 * 降级：VideoEncoder 不可用 / codec 不支持 → WebM 实时录制老路径
 * ========================================================= */

/* --- 最小 MP4 盒子工具 --- */
function mp4Box(type){
  const parts = Array.prototype.slice.call(arguments, 1).filter(p => p);   // 允许 null 子盒（如无音轨）
  let size = 0;
  for (const p of parts) size += p.length;
  const out = new Uint8Array(8 + size);
  const dv = new DataView(out.buffer);
  dv.setUint32(0, out.length);
  for (let i = 0; i < 4; i++) out[4 + i] = type.charCodeAt(i);
  let off = 8;
  for (const p of parts){ out.set(p, off); off += p.length; }
  return out;
}
function mp4FullBox(type, version, flags){
  const parts = Array.prototype.slice.call(arguments, 3);
  const head = new Uint8Array(4);
  head[0] = version;
  head[1] = (flags >> 16) & 255; head[2] = (flags >> 8) & 255; head[3] = flags & 255;
  return mp4Box.apply(null, [type, head].concat(parts));
}
const mp4U8 = v => new Uint8Array([v & 255]);
const mp4U16 = v => { const u = new Uint8Array(2); new DataView(u.buffer).setUint16(0, v); return u; };
const mp4U24 = v => { const u = new Uint8Array(3); u[0]=(v>>16)&255; u[1]=(v>>8)&255; u[2]=v&255; return u; };
const mp4U32 = v => { const u = new Uint8Array(4); new DataView(u.buffer).setUint32(0, v >>> 0); return u; };
const mp4Str = s => { const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; };
const mp4Zeros = n => new Uint8Array(n);
/* 相同 duration 的连续 sample 合并为 stts entry */
function mp4Stts(durations, timescale){
  const entries = [];
  for (const d of durations){
    if (entries.length && entries[entries.length - 1][0] === d) entries[entries.length - 1][1]++;
    else entries.push([d, 1]);
  }
  const parts = [mp4U32(entries.length)];
  for (const [d, n] of entries) parts.push(mp4U32(n), mp4U32(d));
  return mp4FullBox('stts', 0, 0, mp4Concat(parts));
}
function mp4Concat(arrs){
  let size = 0;
  for (const a of arrs) size += a.length;
  const out = new Uint8Array(size);
  let off = 0;
  for (const a of arrs){ out.set(a, off); off += a.length; }
  return out;
}

/* 36 字节 unity 变换矩阵 */
function mp4Matrix(){
  return mp4Concat([
    mp4U32(0x10000), mp4U32(0), mp4U32(0),
    mp4U32(0), mp4U32(0x10000), mp4U32(0),
    mp4U32(0), mp4U32(0), mp4U32(0x40000000)
  ]);
}
function mp4Tkhd(trackId, durMovie, volume, widthFixed, heightFixed){
  return mp4FullBox('tkhd', 0, 3,
    mp4U32(0), mp4U32(0), mp4U32(trackId), mp4U32(0),
    mp4U32(durMovie), mp4Zeros(8),
    mp4U16(0), mp4U16(0), mp4U16(volume), mp4U16(0),
    mp4Matrix(), mp4U32(widthFixed), mp4U32(heightFixed));
}
function mp4Dinf(){
  return mp4Box('dinf', mp4FullBox('dref', 0, 0, mp4U32(1), mp4FullBox('url ', 0, 1)));
}
function mp4Mdia(timescale, durTs, handlerType, handlerName, minf){
  const mdhd = mp4FullBox('mdhd', 0, 0, mp4U32(0), mp4U32(0), mp4U32(timescale), mp4U32(durTs),
    mp4U16(0x55C4), mp4U16(0));
  const hdlr = mp4FullBox('hdlr', 0, 0, mp4U32(0), mp4Str(handlerType), mp4Zeros(12), mp4Str(handlerName), mp4U8(0));
  return mp4Box('mdia', mdhd, hdlr, minf);
}

function createMp4Muxer(vInfo, aInfo){
  /* vInfo: {width,height,fps,timescale,frameDur}  aInfo: {sampleRate,channels} | null */
  const vSamples = [];   // {data, key}
  const aSamples = [];   // {data, durSamples}
  let vDesc = null, aDesc = null;
  return {
    setVideoDesc(d){ vDesc = new Uint8Array(d); },
    setAudioDesc(d){ aDesc = new Uint8Array(d); },
    addVideoFrame(data, key){ vSamples.push({ data, key: !!key }); },
    addAudioChunk(data, durSamples){ aSamples.push({ data, durSamples }); },
    hasAudio(){ return !!(aInfo && aSamples.length); },
    build(){
      const movieTs = 1000;
      /* --- mdat 数据 --- */
      const vBytes = vSamples.reduce((s, x) => s + x.data.length, 0);
      const aBytes = aSamples.reduce((s, x) => s + x.data.length, 0);
      const mdatPayload = new Uint8Array(vBytes + aBytes);
      let off = 0;
      const vOffsets = [];
      for (const s of vSamples){ vOffsets.push(off); mdatPayload.set(s.data, off); off += s.data.length; }
      const aOffsets = [];
      for (const s of aSamples){ aOffsets.push(off); mdatPayload.set(s.data, off); off += s.data.length; }
      const ftyp = mp4Box('ftyp', mp4Str('isom'), mp4U32(0x200), mp4Str('isom'), mp4Str('iso2'), mp4Str('avc1'), mp4Str('mp4a'));
      const mdat = mp4Box('mdat', mdatPayload);
      const dataStart = ftyp.length + 8;   // mdat 头之后

      /* --- 视频 trak --- */
      let vTrak = null;
      let vDurMovie = 0;
      if (vSamples.length){
        const vDurTs = vSamples.length * vInfo.frameDur;
        vDurMovie = Math.round(vDurTs / vInfo.timescale * movieTs);
        const avcC = vDesc ? mp4Box('avcC', vDesc) : mp4Box('avcC', mp4Zeros(8));
        const avc1 = mp4Box('avc1', mp4Zeros(6), mp4U16(1), mp4Zeros(16),
          mp4U16(vInfo.width), mp4U16(vInfo.height),
          mp4U32(0x00480000), mp4U32(0x00480000), mp4U32(0), mp4U16(1),
          mp4Zeros(32), mp4U16(24), mp4U16(0xFFFF), avcC);
        const vStsd = mp4FullBox('stsd', 0, 0, mp4U32(1), avc1);
        const vStts = mp4Stts(vSamples.map(() => vInfo.frameDur), vInfo.timescale);
        const keyIdx = [];
        vSamples.forEach((s, i) => { if (s.key) keyIdx.push(i + 1); });
        const vStss = mp4FullBox('stss', 0, 0, mp4U32(keyIdx.length || 1), mp4Concat(keyIdx.map(n => mp4U32(n))));
        const vStsc = mp4FullBox('stsc', 0, 0, mp4U32(1), mp4U32(1), mp4U32(1), mp4U32(1));
        const vStsz = mp4FullBox('stsz', 0, 0, mp4U32(0), mp4U32(vSamples.length),
          mp4Concat(vSamples.map(s => mp4U32(s.data.length))));
        const vStco = mp4FullBox('stco', 0, 0, mp4U32(vOffsets.length),
          mp4Concat(vOffsets.map(o => mp4U32(dataStart + o))));
        const vStbl = mp4Box('stbl', vStsd, vStts, vStss, vStsc, vStsz, vStco);
        const vMinf = mp4Box('minf',
          mp4FullBox('vmhd', 0, 1, mp4U16(0), mp4U16(0), mp4U16(0), mp4U16(0)),
          mp4Dinf(), vStbl);
        const vTkhd = mp4Tkhd(1, vDurMovie, 0x0100, vInfo.width << 16, vInfo.height << 16);
        vTrak = mp4Box('trak', vTkhd, mp4Mdia(vInfo.timescale, vDurTs, 'vide', 'VideoHandler', vMinf));
      }

      /* --- 音频 trak --- */
      let aTrak = null;
      let aDurMovie = 0;
      if (this.hasAudio()){
        const aTs = aInfo.sampleRate;
        const aDurTs = aSamples.reduce((s, x) => s + x.durSamples, 0);
        aDurMovie = Math.round(aDurTs / aTs * movieTs);
        const dsi = aDesc || mp4U16(0x1210);   // AudioSpecificConfig 兜底 AAC-LC 48k stereo
        const dcd = mp4Concat([
          mp4U8(0x40), mp4U8(0x15 << 2 | 1), mp4U24(0),
          mp4U32(128000), mp4U32(128000),
          mp4U8(0x05), mp4U8(dsi.length), dsi
        ]);
        const esPayload = mp4Concat([
          mp4U16(1), mp4U8(0),
          mp4U8(0x04), mp4U8(dcd.length), dcd,
          mp4U8(0x06), mp4U8(1), mp4U8(0x02)
        ]);
        const esds = mp4FullBox('esds', 0, 0, mp4Concat([mp4U8(0x03), mp4U8(esPayload.length), esPayload]));
        const mp4a = mp4Box('mp4a', mp4Zeros(6), mp4U16(1), mp4U16(0), mp4U16(0), mp4U32(0),
          mp4U16(aInfo.channels), mp4U16(16), mp4U16(0), mp4U16(0),
          mp4U32(aInfo.sampleRate << 16), esds);
        const aStsd = mp4FullBox('stsd', 0, 0, mp4U32(1), mp4a);
        const aStts = mp4Stts(aSamples.map(s => s.durSamples), aTs);
        const aStsc = mp4FullBox('stsc', 0, 0, mp4U32(1), mp4U32(1), mp4U32(1), mp4U32(1));
        const aStsz = mp4FullBox('stsz', 0, 0, mp4U32(0), mp4U32(aSamples.length),
          mp4Concat(aSamples.map(s => mp4U32(s.data.length))));
        const aStco = mp4FullBox('stco', 0, 0, mp4U32(aOffsets.length),
          mp4Concat(aOffsets.map(o => mp4U32(dataStart + o))));
        const aStbl = mp4Box('stbl', aStsd, aStts, aStsc, aStsz, aStco);
        const aMinf = mp4Box('minf',
          mp4FullBox('smhd', 0, 0, mp4U16(0), mp4U16(0)),
          mp4Dinf(), aStbl);
        const aTkhd = mp4Tkhd(2, aDurMovie, 0x0100, 0, 0);
        aTrak = mp4Box('trak', aTkhd, mp4Mdia(aTs, aDurTs, 'soun', 'SoundHandler', aMinf));
      }

      const totalDur = Math.max(vDurMovie, aDurMovie);
      const mvhd = mp4FullBox('mvhd', 0, 0, mp4U32(0), mp4U32(0), mp4U32(movieTs), mp4U32(totalDur),
        mp4U32(0x10000), mp4U16(0x100), mp4Zeros(10),
        mp4Matrix(), mp4Zeros(24), mp4U32(2));
      const moov = mp4Box('moov', mvhd, vTrak, aTrak);
      return new Blob([ftyp, mdat, moov], { type: 'video/mp4' });
    }
  };
}

/* --- 帧精确导出实现 --- */
let frameCancel = false;
async function pickExportMode(){
  if (!window.VideoEncoder || !window.VideoFrame || !window.VideoEncoder.isConfigSupported) return 'webm';
  for (const codec of ['avc1.640028', 'avc1.4d0028', 'avc1.42001f']){
    try {
      const s = await VideoEncoder.isConfigSupported({ codec, width: CW, height: CH, bitrate: 8000000, framerate: 30 });
      if (s.supported) return 'mp4';
    } catch(e){}
  }
  return 'webm';
}
function audioSourceClips(){
  const out = [];
  for (const t of ['audio','video']){
    for (const c of state.tracks[t]){
      const key = t === 'video' ? rowKey(c.trackN || 0) : t;
      if (trackHidden(key)) continue;
      if (c.type === 'audio' || c.type === 'video') out.push(c);
    }
  }
  return out;
}
/* 素材音频解码（AudioBuffer 缓存 promise，防重复解码） */
function audioBufferOf(asset){
  if (!asset) return null;
  if (asset._abPromise) return asset._abPromise;
  if (!asset.file || !window.AudioContext){ asset._abPromise = Promise.resolve(null); return asset._abPromise; }
  const AC = window.AudioContext || window.webkitAudioContext;
  const ac = new AC();
  asset._abPromise = asset.file.arrayBuffer()
    .then(ab => ac.decodeAudioData(ab))
    .then(buf => { asset.audioBuffer = buf; try { ac.close(); } catch(e){} return buf; })
    .catch(() => { try { ac.close(); } catch(e){} return null; });
  return asset._abPromise;
}
function seekEl(el, t){
  return new Promise(resolve => {
    let done = false;
    const finish = () => {
      if (done) return;
      done = true;
      el.removeEventListener('seeked', finish);
      resolve();
    };
    el.addEventListener('seeked', finish);
    try { el.currentTime = t; } catch(e){ finish(); return; }
    setTimeout(finish, 1500);
  });
}
function waitForReady(el){
  if (el.readyState >= 2) return Promise.resolve();
  return new Promise(resolve => {
    let done = false;
    const finish = () => { if (done) return; done = true; el.removeEventListener('loadeddata', finish); resolve(); };
    el.addEventListener('loadeddata', finish);
    setTimeout(finish, 10000);
  });
}
/* 返回 {blob}，失败 throw */
async function exportMp4Blob(onProgress){
  const fps = 30;
  const totalFrames = Math.max(1, Math.ceil(state.duration * fps));
  /* 1) 选 codec */
  let codec = null;
  for (const cd of ['avc1.640028', 'avc1.4d0028', 'avc1.42001f']){
    try {
      const s = await VideoEncoder.isConfigSupported({ codec: cd, width: CW, height: CH, bitrate: 8000000, framerate: fps });
      if (s.supported){ codec = cd; break; }
    } catch(e){}
  }
  if (!codec) throw new Error('no-supported-codec');
  const hasAAC = !!(window.AudioEncoder && window.AudioData);
  /* 2) 混音（OfflineAudioContext）→ AAC */
  const muxer = createMp4Muxer(
    { width: CW, height: CH, fps, timescale: 90000, frameDur: 3000 },
    hasAAC ? { sampleRate: 48000, channels: 2 } : null);
  const sources = audioSourceClips();
  if (sources.length && hasAAC){
    try {
      await encodeAudioTrack(sources, muxer, onProgress);
    } catch(e){ /* 音频编码失败 → 出无声 MP4 */ }
  }
  /* 3) 逐帧 seek + 绘制 + 编码 */
  const savedTime = state.time;
  setPlaying(false);
  const encoder = new VideoEncoder({
    output: (chunk, meta) => {
      if (meta && meta.decoderConfig && meta.decoderConfig.description){
        muxer.setVideoDesc(meta.decoderConfig.description);
      }
      const d = new Uint8Array(chunk.byteLength);
      chunk.copyTo(d);
      muxer.addVideoFrame(d, chunk.type === 'key');
    },
    error: e => {}
  });
  encoder.configure({ codec, width: CW, height: CH, bitrate: 8000000, framerate: fps, avc: { format: 'avc' } });
  for (let f = 0; f < totalFrames; f++){
    if (frameCancel) { try { encoder.close(); } catch(e){} throw new Error('cancelled'); }
    const t = f / fps;
    /* 多轨激活片段 seek（隐藏行跳过） */
    const actives = state.tracks.video.filter(c => c.type === 'video' &&
      !rowHidden(c.trackN || 0) && t >= c.start && t < clipEnd(c));
    for (const c of actives){
      const el = mediaEl(c);
      if (!el) continue;
      await waitForReady(el);
      const target = (c.in || 0) + (t - c.start) * (c.speed || 1);
      if (Math.abs(el.currentTime - target) > 0.001) await seekEl(el, target);
    }
    /* V1 层转场：背景片段 seek 到末帧 */
    for (const c of actives){
      if ((c.trackN || 0) !== 0) continue;
      const trans = c.transIn;
      if (!trans || trans.type === 'none' || trans.type === 'fade' || t - c.start >= trans.dur) continue;
      const prev = prevClipOf(c, 0);
      if (!prev || prev.type !== 'video') continue;
      const pel = mediaEl(prev);
      if (!pel) continue;
      const tEnd = (prev.in || 0) + Math.max(0, prev.dur - 0.02) * (prev.speed || 1);
      await waitForReady(pel);
      if (Math.abs(pel.currentTime - tEnd) > 0.001) await seekEl(pel, tEnd);
    }
    state.time = t;
    drawFrame();
    const frame = new VideoFrame(cv, { timestamp: Math.round(f * 1e6 / fps), duration: Math.round(1e6 / fps) });
    encoder.encode(frame, { keyFrame: f % (fps * 2) === 0 });
    frame.close();
    if (onProgress) onProgress(f + 1, totalFrames);
  }
  await encoder.flush();
  state.time = savedTime;
  seek(savedTime);
  /* 4) 封装 */
  return { blob: muxer.build(), ext: 'mp4' };
}
async function encodeAudioTrack(clips, muxer, onProgress){
  const SR = 48000;
  /* 解码所有素材音频 */
  const decoded = await Promise.all(clips.map(c => audioBufferOf(assetOf(c))));
  const hasAny = decoded.some(b => b);
  if (!hasAny) return;
  const oac = new OfflineAudioContext(2, Math.max(1, Math.ceil(state.duration * SR)), SR);
  clips.forEach((c, i) => {
    const buf = decoded[i];
    if (!buf) return;
    const src = oac.createBufferSource();
    src.buffer = buf;
    src.playbackRate.value = c.speed || 1;
    const g = oac.createGain();
    const vol = c.muted ? 0 : clamp(c.volume, 0, 1);
    g.gain.value = vol;
    if (c.fadeIn > 0){
      g.gain.setValueAtTime(0, c.start);
      g.gain.linearRampToValueAtTime(vol, c.start + c.fadeIn);
    }
    if (c.fadeOut > 0){
      g.gain.setValueAtTime(vol, Math.max(c.start, clipEnd(c) - c.fadeOut));
      g.gain.linearRampToValueAtTime(0, clipEnd(c));
    }
    src.connect(g);
    g.connect(oac.destination);
    const offset = clamp(c.in || 0, 0, buf.duration);
    const playSrc = c.dur * (c.speed || 1);
    src.start(c.start, offset, clamp(playSrc, 0, Math.max(0, buf.duration - offset)));
  });
  const rendered = await oac.startRendering();
  let aDesc = null;
  const enc = new AudioEncoder({
    output: (chunk, meta) => {
      if (meta && meta.decoderConfig && meta.decoderConfig.description){
        aDesc = new Uint8Array(meta.decoderConfig.description);
      }
      const d = new Uint8Array(chunk.byteLength);
      chunk.copyTo(d);
      muxer.addAudioChunk(d, Math.max(1, Math.round(chunk.duration * 48 / 1000)));
    },
    error: () => {}
  });
  enc.configure({ codec: 'mp4a.40.2', sampleRate: SR, numberOfChannels: 2, bitrate: 128000 });
  const l = rendered.getChannelData(0);
  const r = rendered.numberOfChannels > 1 ? rendered.getChannelData(1) : l;
  const CHUNK = 10240;
  for (let off = 0; off < rendered.length; off += CHUNK){
    const n = Math.min(CHUNK, rendered.length - off);
    const data = new Float32Array(n * 2);
    data.set(l.subarray(off, off + n), 0);
    data.set(r.subarray(off, off + n), n);
    const ad = new AudioData({
      format: 'f32-planar', sampleRate: SR, numberOfFrames: n,
      numberOfChannels: 2, timestamp: Math.round(off / SR * 1e6), data
    });
    enc.encode(ad);
    ad.close();
  }
  await enc.flush();
  muxer.setAudioDesc(aDesc);
}
async function startFrameExport(){
  if (exporting) return;
  exporting = true;
  frameCancel = false;
  const name = $('#projName').value.trim() || 'online-video';
  openFrameProgress();
  try {
    const result = await exportMp4Blob((f, total) => updateFrameProgress(f, total));
    if (frameCancel){ closeModal(); toast('已取消导出'); return; }
    download(name + '.mp4', result.blob);
    closeModal();
    toast('导出完成：' + name + '.mp4（' + (result.blob.size / 1048576).toFixed(1) + ' MB）', 4000);
  } catch(e){
    closeModal();
    if (e && e.message === 'cancelled') toast('已取消导出');
    else {
      toast('MP4 导出失败（' + (e.message || e) + '），已改用 WebM 模式');
      startExport();
    }
  }
  exporting = false;
}

/* ---------- 工程保存 / 载入 ---------- */
function saveProject(){
  const data = {
    app: 'online-video', v: 1,
    name: $('#projName').value.trim() || '未命名项目',
    assets: state.assets.map(a => ({ id: a.id, type: a.type, name: a.name, duration: a.duration, width: a.width, height: a.height })),
    tracks: JSON.parse(serializeTracks()),
    time: state.time
  };
  download(data.name + '.ovproj', new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
  toast('工程已保存（媒体文件需重新载入）');
}
function loadProjectFile(file){
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try { data = JSON.parse(reader.result); }
    catch(e){ toast('工程文件解析失败'); return; }
    if (data.app !== 'online-video'){ toast('不是有效的咪咪剪辑工程文件'); return; }
    setPlaying(false);
    pauseAllMedia();
    for (const c of elsByClip.values()){ try { if (c.pause) c.pause(); } catch(e){} }
    elsByClip.clear();
    state.assets = (data.assets || []).map(a => ({ ...a, url: null, thumb: null }));
    state.tracks = { video: [], text: [], audio: [] };
    for (const t of ['video','text','audio']){
      state.tracks[t] = (data.tracks && data.tracks[t]) || [];
    }
    state.time = data.time || 0;
    state.selection = null;
    $('#projName').value = data.name || '未命名项目';
    history = []; future = [];
    // 为每个片段重建元素（素材未载入前 url 为空）
    relinkAssets();
    renderLibrary(); recalcDuration(); renderTimeline(); buildProps(); updateToolbar();
    seek(state.time);
    toast('工程已载入，共 ' + state.assets.length + ' 个素材（缺媒体时请点「载入工程」旁提示重新选择文件）');
  };
  reader.readAsText(file);
}
/* 尝试用已存在的 objectURL 重建；提供重新选择媒体文件的入口 */
function relinkAssets(){
  // 保存工程后 objectURL 已失效，这里提供手动重链入口
  if (state.assets.some(a => !a.url)){
    setTimeout(() => {
      openRelinkModal();
    }, 300);
  } else {
    rebuildClipElements();
  }
}
function openRelinkModal(){
  $('#modalRoot').innerHTML =
    '<div class="modal-mask"><div class="modal"><h3>📁 重新关联媒体文件</h3>' +
    '<div class="m-body">工程里的时间轴已恢复，但媒体文件本体不保存在工程文件中。<br>请选择<b>与原素材同名</b>的视频 / 图片 / 音频文件，咪咪会自动按文件名对上号。</div>' +
    '<div class="m-btns"><button id="btnRelinkSkip">稍后</button><button id="btnRelinkPick" class="primary">选择媒体文件</button></div>' +
    '</div></div>';
  $('#btnRelinkSkip').addEventListener('click', () => { closeModal(); toast('缺失素材的片段将显示为占位画面'); });
  $('#btnRelinkPick').addEventListener('click', () => {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.multiple = true;
    inp.accept = 'video/*,image/*,audio/*';
    inp.onchange = () => {
      closeModal();
      const files = Array.from(inp.files || []);
      let ok = 0;
      Promise.all(files.map(f => new Promise(res => {
        const target = state.assets.find(a => !a.url && (f.name === a.name + extGuess(a) || f.name.startsWith(a.name)));
        if (!target){ res(); return; }
        target.url = URL.createObjectURL(f);
        ok++;
        // 重新取缩略图
        probeAssetMedia(target).then(res);
      }))).then(() => {
        rebuildClipElements();
        renderLibrary(); renderClips();
        toast('已重新关联 ' + ok + ' 个媒体文件');
      });
    };
    inp.click();
  });
}
function extGuess(a){ return ''; }
function probeAssetMedia(a){
  return new Promise(resolve => {
    if (a.type === 'image'){
      const img = new Image();
      img.onload = () => {
        const tc = document.createElement('canvas');
        tc.width = 148; tc.height = 84;
        tc.getContext('2d').drawImage(img, 0, 0, 148, 84);
        a.thumb = tc.toDataURL('image/jpeg', .7);
        resolve();
      };
      img.onerror = () => resolve();
      img.src = a.url;
    } else {
      const el = document.createElement(a.type);
      el.preload = 'auto';
      el.onloadedmetadata = () => {
        a.duration = el.duration;
        if (a.type === 'video'){
          el.currentTime = Math.min(0.1, (el.duration || 1) / 2);
          el.onseeked = () => {
            const tc = document.createElement('canvas');
            tc.width = 148; tc.height = 84;
            tc.getContext('2d').drawImage(el, 0, 0, 148, 84);
            a.thumb = tc.toDataURL('image/jpeg', .7);
            resolve();
          };
          setTimeout(resolve, 3000);
        } else resolve();
      };
      el.onerror = () => resolve();
      el.src = a.url;
    }
  });
}
function rebuildClipElements(){
  for (const t of ['video','text','audio']){
    for (const c of state.tracks[t]){
      if (c.type === 'text') continue;
      if (!elsByClip.has(c.id)) createClipElement(c);
    }
  }
}

/* ---------- 顶栏 / 工具栏 ---------- */
function updateToolbar(){
  $('#btnUndo').disabled = !history.length;
  $('#btnRedo').disabled = !future.length;

  $('#btnDeleteClip').disabled = !anySel;

}

/* ---------- 键盘快捷键 ---------- */
window.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  if (e.ctrlKey || e.metaKey){
    if (e.key === 'z' || e.key === 'Z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); }
    else if (e.key === 'y' || e.key === 'Y'){ e.preventDefault(); redo(); }
    else if (e.key === 'd' || e.key === 'D'){ e.preventDefault(); duplicateSelected(); }
    return;
  }
  switch (e.key){
    case ' ': e.preventDefault(); togglePlay(); break;
    case 's': case 'S': splitSelected(); break;
    case 't': case 'T': pushHistory(); addTextClip(); break;
    case 'Delete': case 'Backspace': deleteSelected(e.shiftKey); break;
    case 'Home': seek(0); break;
    case 'End': seek(state.duration); break;
    case 'ArrowLeft': seek(state.time - (e.shiftKey ? 1 : 0.1)); break;
    case 'ArrowRight': seek(state.time + (e.shiftKey ? 1 : 0.1)); break;
  }
});

/* ---------- 启动 ---------- */
function openRestoreModal(payload){
  $('#modalRoot').innerHTML =
    '<div class="modal-mask"><div class="modal"><h3>🕐 检测到上次未完成的剪辑</h3>' +
    '<div class="m-body">自动保存于 ' + new Date(payload.savedAt).toLocaleTimeString() + '，包含 ' +
    (payload.assets ? payload.assets.length : 0) + ' 个素材。是否恢复继续编辑？</div>' +
    '<div class="m-btns"><button id="btnRestoreNo">丢弃</button><button id="btnRestoreYes" class="primary">恢复继续编辑</button></div>' +
    '</div></div>';
  $('#btnRestoreNo').addEventListener('click', () => { discardAutosave(); closeModal(); });
  $('#btnRestoreYes').addEventListener('click', () => {
    restoreAutosave(payload).then(ok => {
      closeModal();
      toast(ok ? '已恢复上次剪辑进度' : '恢复失败');
    });
  });
}
function init(){
  renderLibrary();
  recalcDuration();
  renderClips();
  renderTrackHeads();
  buildProps();
  updateToolbar();
  drawRuler();
  document.body.setAttribute('data-init-ok', '1');
  requestAnimationFrame(ts => { lastTs = ts; requestAnimationFrame(tick); });
  // 项目名变更 → 自动保存
  $('#projName').addEventListener('change', scheduleAutosave);
  // 视频轨行增删
  $('#btnAddRow').addEventListener('click', addVideoRow);
  $('#btnDelRow').addEventListener('click', removeVideoRow);
  // 时间轴纵向滚动时同步轨道头
  tlScroll.addEventListener('scroll', () => { $('#tlHeads').scrollTop = tlScroll.scrollTop; });
  // 轨道头 锁定/隐藏 按钮（事件委托，renderTrackHeads 重绘不影响）
  $('#tlHeads').addEventListener('click', e => {
    const btn = e.target.closest('.th-btn');
    if (btn) toggleTrack(btn.dataset.t, btn.dataset.act);
  });
  // 页面卸载前尽力保存一次
  window.addEventListener('beforeunload', () => { if (AS.enabled) performAutosave(); });
  // 启动时检查自动存档
  loadAutosave().then(p => {
    const has = p && ((p.tracks && ['video','text','audio'].some(t => p.tracks[t] && p.tracks[t].length)) ||
                      (p.assets && p.assets.length));
    if (has) openRestoreModal(p);
    else setSaveState('自动保存就绪');
  });
}
init();

  cv, ctx,

};
